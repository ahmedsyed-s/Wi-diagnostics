name: Bug
description: Something doesn't work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: And what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to reproduce
      placeholder: |
        1. npm run web:demo
        2. …
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: System
      options: [macOS, Linux, Windows]
    validations:
      required: true
  - type: dropdown
    id: interface
    attributes:
      label: Interface
      options: [Terminal (npm run cli), 3D browser (npm run web), Desktop app]
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: No real SSIDs, BSSIDs or IPs. If you can, reproduce it in demo mode.
      render: text
