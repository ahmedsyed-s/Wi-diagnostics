<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WI//DIAG — RF Space</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Space+Grotesk:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "/vendor/three/build/three.module.js",
          "three/addons/": "/vendor/three/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div id="stage"></div>

    <!-- Boot -->
    <div id="boot" class="boot">
      <canvas id="boot-rain"></canvas>
      <div class="boot-center">
        <div class="boot-logo" id="boot-logo">WI//DIAG</div>
        <div class="boot-sub" id="boot-sub" data-i18n="boot.connecting">connecting to engine…</div>
        <div class="boot-bar"><i id="boot-bar"></i></div>
      </div>
    </div>

    <div id="hud" class="hud">
      <!-- Top bar -->
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark">◢◤</span>
          <span class="brand-name">WI<b>//</b>DIAG</span>
          <span class="brand-ver" id="ver">v2</span>
        </div>

        <div class="pill status" id="status">
          <i class="dot"></i><span id="status-text">connecting</span>
        </div>

        <div class="linkbar" id="linkbar" hidden>
          <div class="lk-id">
            <span class="lk-diamond">◆</span>
            <span id="lk-ssid">—</span>
            <span class="lk-sub" id="lk-sub"></span>
          </div>
          <div class="lk-metric"><label>RSSI</label><b id="lk-rssi">—</b><small>dBm</small></div>
          <div class="lk-metric"><label>SNR</label><b id="lk-snr">—</b><small>dB</small></div>
          <div class="lk-metric"><label>TX</label><b id="lk-tx">—</b><small>Mbps</small></div>
          <div class="lk-metric"><label>GW</label><b id="lk-gw">—</b><small>ms</small></div>
          <div class="lk-metric"><label>NET</label><b id="lk-net">—</b><small>ms</small></div>
          <div class="lk-quality" title="Composite link quality">
            <svg viewBox="0 0 36 36"><circle class="track" cx="18" cy="18" r="15" /><circle class="arc" id="lk-q-arc" cx="18" cy="18" r="15" /></svg>
            <span id="lk-q">—</span>
          </div>
        </div>

        <div class="top-actions">
          <div class="seg" id="cam-seg" data-i18n-title="cam.title" title="Camera (1·2·3)">
            <button data-cam="orbit" class="on" data-i18n="cam.orbit">Orbit</button>
            <button data-cam="radar" data-i18n="cam.radar">Radar</button>
            <button data-cam="ground" data-i18n="cam.ground">Ground</button>
          </div>
          <select id="env" data-i18n-title="env.title" title="Propagation model">
            <option value="open" data-i18n="env.open">Open space</option>
            <option value="residential" selected data-i18n="env.residential">Residential</option>
            <option value="office" data-i18n="env.office">Office</option>
            <option value="dense" data-i18n="env.dense">Dense building</option>
          </select>
          <div class="menu" id="view-menu">
            <button class="icon-btn" data-menu data-i18n-title="layers.title" title="Layers">
              <svg viewBox="0 0 24 24"><path d="M12 3 2 8l10 5 10-5-10-5Z" /><path d="m2 13 10 5 10-5" /></svg>
            </button>
            <div class="menu-pop">
              <label><input type="checkbox" id="opt-field" checked /> <span data-i18n="layers.field">RF field</span> <kbd>F</kbd></label>
              <label><input type="checkbox" id="opt-beams" checked /> <span data-i18n="layers.beams">Signal beams</span></label>
              <label><input type="checkbox" id="opt-rain" checked /> <span data-i18n="layers.rain">Digital rain</span> <kbd>R</kbd></label>
              <label><input type="checkbox" id="opt-rotate" checked /> <span data-i18n="layers.rotate">Auto-rotate</span> <kbd>␣</kbd></label>
              <div class="menu-sep"></div>
              <div class="menu-title"><span data-i18n="labels.title">Labels</span> <kbd>L</kbd></div>
              <div class="seg small" id="label-seg">
                <button data-labels="auto" class="on" data-i18n="labels.auto">Auto</button>
                <button data-labels="all" data-i18n="labels.all">All</button>
                <button data-labels="off" data-i18n="labels.off">Off</button>
              </div>
            </div>
          </div>
          <div class="menu" id="export-menu">
            <button class="icon-btn" data-menu data-i18n-title="export.title" title="Export">
              <svg viewBox="0 0 24 24"><path d="M12 3v12" /><path d="m7 10 5 5 5-5" /><path d="M5 21h14" /></svg>
            </button>
            <div class="menu-pop">
              <button data-export="png" data-i18n="export.png">Scene capture (PNG)</button>
              <button data-export="csv" data-i18n="export.csv">Networks (CSV)</button>
              <button data-export="json" data-i18n="export.json">Full snapshot (JSON)</button>
              <div class="menu-sep"></div>
              <button data-export="pdf" data-i18n="export.pdf">PDF report</button>
              <button data-export="word" data-i18n="export.word">DOCX report</button>
              <button data-export="excel" data-i18n="export.excel">XLSX spreadsheet</button>
            </div>
          </div>
          <button class="icon-btn" id="btn-cinema" data-i18n-title="cinema.title" title="Cinema mode (H)">
            <svg viewBox="0 0 24 24"><path d="M4 9V5h4M20 9V5h-4M4 15v4h4M20 15v4h-4" /></svg>
          </button>
        </div>
      </header>

      <div class="notice" id="notice" hidden>
        <span id="notice-text"></span>
        <button id="notice-close" data-i18n-title="common.close" aria-label="Close">×</button>
      </div>

      <!-- Networks -->
      <aside class="panel networks" id="networks">
        <div class="panel-head">
          <h2><span data-i18n="networks.title">Networks</span> <span class="count" id="net-count">0</span></h2>
          <button class="icon-btn small" id="collapse-networks" data-i18n-title="networks.collapse" title="Collapse (N)">
            <svg viewBox="0 0 24 24"><path d="m15 6-6 6 6 6" /></svg>
          </button>
        </div>
        <div class="net-tools">
          <input id="search" type="search" data-i18n-placeholder="networks.search" placeholder="Search  /" autocomplete="off" />
          <div class="chips" id="band-chips">
            <button data-band="all" class="on" data-i18n="bands.all">All</button>
            <button data-band="2.4">2.4</button>
            <button data-band="5">5</button>
            <button data-band="6">6</button>
          </div>
          <select id="sort" data-i18n-title="networks.sort" title="Sort">
            <option value="signal" data-i18n="sort.signal">Signal</option>
            <option value="distance" data-i18n="sort.distance">Distance</option>
            <option value="channel" data-i18n="sort.channel">Channel</option>
            <option value="name" data-i18n="sort.name">Name</option>
          </select>
        </div>
        <ul class="net-list" id="net-list"></ul>
        <div class="net-foot" id="net-foot"></div>
      </aside>
      <button class="panel-tab" id="networks-tab" data-i18n="networks.tab" hidden>NETWORKS</button>

      <!-- Inspector -->
      <aside class="panel inspector" id="inspector" hidden>
        <div class="ins-head">
          <div>
            <div class="ins-badges" id="ins-badges"></div>
            <h2 id="ins-name">—</h2>
            <div class="ins-sub" id="ins-sub"></div>
          </div>
          <button class="icon-btn small" id="ins-close" data-i18n-title="ins.close" title="Close (Esc)">×</button>
        </div>
        <div class="ins-gauges">
          <div class="gauge" id="g-rssi">
            <svg viewBox="0 0 100 60"><path class="g-track" d="M10 55 A40 40 0 0 1 90 55" /><path class="g-arc" id="g-rssi-arc" d="M10 55 A40 40 0 0 1 90 55" /></svg>
            <b id="g-rssi-val">—</b><label>dBm</label>
          </div>
          <div class="dist">
            <label data-i18n="ins.distance">Estimated distance</label>
            <b id="ins-dist">—</b>
            <div class="range"><i id="ins-range-bar"></i><span id="ins-range-dot"></span></div>
            <small id="ins-range">—</small>
          </div>
        </div>
        <canvas class="ins-spark" id="ins-spark" height="70"></canvas>
        <dl class="kv" id="ins-kv"></dl>
        <div class="interf">
          <div class="interf-head"><label data-i18n="ins.interference">Interference</label><b id="ins-int">—</b></div>
          <div class="meter"><i id="ins-int-bar"></i></div>
          <div class="neighbors" id="ins-neighbors"></div>
        </div>
        <div class="ins-actions">
          <button id="ins-focus" data-i18n="ins.focus">Center camera</button>
        </div>
      </aside>

      <!-- Dock -->
      <section class="dock" id="dock">
        <div class="dock-tabs">
          <button data-tab="spectrum" class="on" data-i18n="dock.spectrum">Spectrum</button>
          <button data-tab="latency" data-i18n="dock.latency">Latency</button>
          <button data-tab="events"><span data-i18n="dock.events">Events</span> <span class="count" id="ev-count">0</span></button>
          <div class="dock-right">
            <div class="chips" id="spec-bands">
              <button data-sband="2.4" class="on">2.4 GHz</button>
              <button data-sband="5">5 GHz</button>
              <button data-sband="6">6 GHz</button>
            </div>
            <span class="dock-info" id="dock-info"></span>
            <button class="icon-btn small" id="collapse-dock" data-i18n-title="dock.collapse" title="Collapse (D)">
              <svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6" /></svg>
            </button>
          </div>
        </div>
        <div class="dock-body">
          <canvas id="spectrum" data-pane="spectrum"></canvas>
          <canvas id="latency" data-pane="latency" hidden></canvas>
          <ul class="events" id="events" data-pane="events" hidden></ul>
        </div>
      </section>
      <button class="dock-tab" id="dock-tab" data-i18n="dock.tab" hidden>SPECTRUM · LATENCY · EVENTS</button>

      <div class="toasts" id="toasts"></div>
      <div class="tooltip" id="tooltip" hidden></div>
      <div class="hints" id="hints">
        <span><kbd>H</kbd> <span data-i18n="hint.cinema">cinema</span></span><span><kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> <span data-i18n="hint.camera">camera</span></span><span><kbd>↑</kbd><kbd>↓</kbd> <span data-i18n="hint.networks">networks</span></span><span><kbd>F</kbd> <span data-i18n="hint.field">RF field</span></span>
      </div>
    </div>

    <script>
      // Boot watchdog (classic script, so it runs even when the module graph fails to load).
      // If main.js never starts, say why on the boot screen instead of hanging silently.
      (() => {
        const CRITICAL = [
          "/js/main.js", "/js/scene.js", "/js/store.js", "/js/hud.js", "/js/charts.js", "/js/util.js", "/js/i18n.js",
          "/vendor/three/build/three.module.js", "/vendor/three/build/three.core.js",
          "/vendor/three/examples/jsm/controls/OrbitControls.js", "/api/snapshot",
        ];
        let reported = false;
        const show = (msg) => {
          if (reported || window.__wiBooted) return;
          reported = true;
          console.error("[WI//DIAG] " + msg);
          const el = document.getElementById("boot-sub");
          if (el) {
            el.textContent = msg;
            el.classList.add("boot-error");
          }
        };
        const probe = async (lead) => {
          for (const url of CRITICAL) {
            const ctl = new AbortController();
            const timer = setTimeout(() => ctl.abort(), 8000);
            try {
              const res = await fetch(url, { cache: "no-store", signal: ctl.signal });
              await res.arrayBuffer();
              if (!res.ok) return show(`${lead}: ${url} → HTTP ${res.status}`);
            } catch (err) {
              return show(`${lead}: ${url} → ${err.name === "AbortError" ? "timed out" : err.message}`);
            } finally {
              clearTimeout(timer);
            }
          }
          show(`${lead}. Open DevTools (F12) → Console for details.`);
        };
        addEventListener("error", (e) => {
          if (window.__wiBooted || reported) return;
          if (e.target && e.target.tagName === "SCRIPT") probe("web UI failed to load");
          else if (e.message) show(`startup error: ${e.message}`);
        }, true);
        setTimeout(() => window.__wiBooted || reported || probe("web UI did not start"), 12000);
      })();
    </script>
    <script type="module" src="/js/main.js"></script>
  </body>
</html>
